                            <iframe

                                onLoad={() => setIframeLoading(false)}
                            ></iframe>

                    </div>

            }

            return (

                        <div className="flex flex-col md:flex-row items-start md:items-center gap-6 mb-8 pb-8 border-b border-slate-100">
                            <div className="w-24 h-24 text-jtt-blue bg-blue-50 rounded-2xl flex items-center justify-center shadow-inner border border-blue-100 flex-shrink-0">
                                {getAppIcon(displayApp.iconStr, "w-12 h-12")}
                            </div>
                            <div>
                                <h2 className="text-3xl md:text-4xl font-black text-slate-800 mb-2">{displayApp.name}</h2>
                                <p className="text-sm md:text-base text-slate-500 font-medium leading-relaxed max-w-3xl">{displayApp.description?.[language] || displayApp.description?.id || displayApp.description}</p>
                            </div>
                        </div>

                        {displayApp.details && displayApp.details.length > 0 ? (
                            <div className="animate-fade-up">
                                <h3 className="text-sm font-black text-slate-400 uppercase tracking-widest mb-6">{language === 'en' ? 'Select a Sub-Module' : 'Pilih Sub-Modul Aplikasi'}</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                                    {displayApp.details.map((sub, idx) => {
                                        const subNotifCount = notifications.filter(n => n.subItemId === sub.id && !n.isRead).length;
                                        return (
                                        <div 
                                            key={sub.id} 
                                            onClick={() => onSelectSubItem(sub.id)}
                                            className="bg-white border border-slate-200 p-6 rounded-2xl hover:shadow-[0_8px_30px_rgba(0,0,0,0.08)] cursor-pointer transition-all duration-300 hover:border-jtt-blue group relative"
                                            style={{ animationDelay: `${idx * 40}ms` }}
                                        >
                                            {subNotifCount > 0 && (
                                                <span className="absolute -top-3 -right-3 bg-jtt-orange text-white text-[11px] font-black px-2.5 py-1 rounded-full shadow-lg animate-bubble-pop z-10 border-[3px] border-white">
                                                    {subNotifCount}
                                                </span>

                                            <div className="w-10 h-10 bg-slate-50 rounded-lg flex items-center justify-center text-slate-400 group-hover:bg-jtt-blue group-hover:text-white transition-colors mb-4">

                                            <h4 className="font-black text-lg text-slate-800 mb-2 group-hover:text-jtt-blue transition-colors line-clamp-2 leading-tight">

                                            </h4>
                                            <p className="text-[10px] text-slate-400 mt-4 flex items-center gap-1.5 font-bold uppercase tracking-widest">

                                <p className="text-slate-500 font-bold">
                                    {language === 'en' ? 'No sub-modules or links configured for this application yet.' : 'Belum ada sub-modul atau tautan yang dikonfigurasi untuk aplikasi ini.'}
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const LoginPage = ({ onLogin, onSignUp, onRequestReset, onSetupPassword, isLoading, language, loginAppearance, initialMode = 'LOGIN', pendingEmail = '' }) => {
            const [mode, setMode] = useState(initialMode); // 'LOGIN', 'SIGNUP', 'FORGOT', 'SETUP'
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [name, setName] = useState('');
            const [position, setPosition] = useState('');
            const [rememberMe, setRememberMe] = useState(false);

            useEffect(() => {
                if (initialMode) setMode(initialMode);
            }, [initialMode]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (mode === 'LOGIN') {
                    if (email.trim() && password) onLogin(email.trim(), password, rememberMe);
                } else if (mode === 'SIGNUP') {
                    if (email.trim() && name.trim()) {
                        const success = await onSignUp({ email: email.trim(), name: name.trim(), position: position.trim() });
                        if (success) { setMode('LOGIN'); setPassword(''); }
                    }
                } else if (mode === 'FORGOT') {
                    if (email.trim()) {
                        const success = await onRequestReset(email.trim());
                        if (success) { setMode('LOGIN'); setPassword(''); }
                    }
                } else if (mode === 'SETUP') {
                    if (password && password === confirmPassword) {
                        onSetupPassword(password);
                    } else {
                        alert(language === 'en' ? 'Passwords do not match' : 'Kata sandi tidak cocok');
                    }
                }
            };

            const renderBackground = () => {
                const url = loginAppearance?.videoUrl;
                const opacity = (loginAppearance?.opacity ?? 25) / 100;
                
                if (!url) return null;
                
                const isImage = url.match(/\.(jpeg|jpg|gif|png)$/i) != null;
                if (isImage) {
                    return <div className="absolute inset-0 z-0 bg-cover bg-center bg-no-repeat pointer-events-none mix-blend-overlay" style={{ backgroundImage: `url(${url})`, opacity }}></div>;
                }

                if (url.includes('youtube.com') || url.includes('youtu.be')) {
                    let embedUrl = url;
                    if (url.includes('watch?v=')) {
                         const videoId = url.split('watch?v=')[1].split('&')[0];
                         embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&controls=0&showinfo=0&rel=0&modestbranding=1`;
                    } else if (url.includes('youtu.be/')) {
                         const videoId = url.split('youtu.be/')[1].split('?')[0];
                         embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&controls=0&showinfo=0&rel=0&modestbranding=1`;
                    }
                    return (
                        <div className="absolute inset-0 z-0 pointer-events-none overflow-hidden mix-blend-overlay" style={{ opacity }}>
                            <iframe src={embedUrl} className="absolute w-[300vw] h-[300vh] top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none" allow="autoplay; encrypted-media" frameBorder="0"></iframe>
                        </div>
                    );
                }
                
                return (
                    <div className="absolute inset-0 z-0 pointer-events-none overflow-hidden mix-blend-overlay" style={{ opacity }}>
                        <video autoPlay loop muted playsInline className="absolute min-w-full min-h-full object-cover top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                            <source src={url} />
                        </video>
                    </div>
                );
            };

            return (

                                    <a href="#" aria-label="YouTube" className="text-white hover:text-[#F26522] transition-colors text-lg"><i className="fa-brands fa-youtube"></i></a>
                                </div>
                            )}

                                <h2 className="text-2xl sm:text-3xl font-black mb-6 md:mb-8 text-white tracking-tight">
                                    {mode === 'LOGIN' ? (language === 'en' ? 'Sign in' : 'Masuk') : 
                                     mode === 'SIGNUP' ? (language === 'en' ? 'Sign up' : 'Daftar Baru') : 
                                     mode === 'SETUP' ? (language === 'en' ? 'New Password' : 'Kata Sandi Baru') :
                                     (language === 'en' ? 'Find Account' : 'Cari Akun')}
                                </h2>

                                <form onSubmit={handleSubmit} className="flex flex-col w-full">
                                    {mode === 'SIGNUP' && (
                                        <>
                                            <div className="mb-4 md:mb-5 animate-fade-up">
                                                <label className="block text-[11px] font-bold text-white mb-1.5">{language === 'en' ? 'Full Name' : 'Nama Lengkap'}</label>
                                                <input type="text" value={name} onChange={(e) => setName(e.target.value)} className="w-full px-4 py-3 bg-white text-black text-sm font-medium rounded-sm outline-none border-none focus:ring-2 focus:ring-[#F26522] shadow-sm transition-all" required={mode === 'SIGNUP'} />
                                            </div>
                                            <div className="mb-4 md:mb-5 animate-fade-up" style={{animationDelay: '100ms'}}>
                                                <label className="block text-[11px] font-bold text-white mb-1.5">{language === 'en' ? 'Position / Department' : 'Jabatan / Departemen'}</label>
                                                <input type="text" value={position} onChange={(e) => setPosition(e.target.value)} className="w-full px-4 py-3 bg-white text-black text-sm font-medium rounded-sm outline-none border-none focus:ring-2 focus:ring-[#F26522] shadow-sm transition-all" />
                                            </div>
                                        </>
                                    )}

                                    {mode !== 'SETUP' && (
                                        <div className="mb-4 md:mb-5 animate-fade-up" style={{animationDelay: mode==='SIGNUP'?'200ms':'0ms'}}>
                                            <label htmlFor="email" className="block text-[11px] font-bold text-white mb-1.5">{language === 'en' ? 'Email Address' : 'Alamat Email'}</label>
                                            <input type="email" id="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full px-4 py-3 bg-white text-black text-sm font-medium rounded-sm outline-none border-none focus:ring-2 focus:ring-[#F26522] shadow-sm transition-all" required />
                                        </div>
                                    )}

                                    {(mode === 'LOGIN' || mode === 'SETUP') && (
                                        <div className="mb-4 md:mb-5 animate-fade-up" style={{animationDelay: '100ms'}}>
                                            <label htmlFor="password" className="block text-[11px] font-bold text-white mb-1.5">{language === 'en' ? (mode === 'SETUP' ? 'New Password' : 'Password') : (mode === 'SETUP' ? 'Kata Sandi Baru' : 'Kata Sandi')}</label>
                                            <input type="password" id="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-3 bg-white text-black text-sm font-medium rounded-sm outline-none border-none focus:ring-2 focus:ring-[#F26522] shadow-sm transition-all" required />
                                        </div>
                                    )}

                                    {mode === 'SETUP' && (
                                        <div className="mb-4 md:mb-5 animate-fade-up" style={{animationDelay: '200ms'}}>
                                            <label htmlFor="confirmPassword" className="block text-[11px] font-bold text-white mb-1.5">{language === 'en' ? 'Confirm Password' : 'Konfirmasi Kata Sandi'}</label>
                                            <input type="password" id="confirmPassword" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} className="w-full px-4 py-3 bg-white text-black text-sm font-medium rounded-sm outline-none border-none focus:ring-2 focus:ring-[#F26522] shadow-sm transition-all" required />
                                        </div>
                                    )}

                                    {mode === 'LOGIN' && (
                                        <div className="flex items-center mb-6 md:mb-8 animate-fade-up" style={{animationDelay: '200ms'}}>
                                            <input type="checkbox" id="remember" checked={rememberMe} onChange={(e) => setRememberMe(e.target.checked)} className="w-4 h-4 rounded-sm border-none bg-white text-[#F26522] cursor-pointer accent-[#F26522]"/>
                                            <label htmlFor="remember" className="ml-2 block text-[11px] font-bold text-white cursor-pointer select-none">{language === 'en' ? 'Remember Me' : 'Ingat Saya'}</label>
                                        </div>
                                    )}

                                    <div className="mt-2 animate-fade-up" style={{animationDelay: '300ms'}}>
                                        <button type="submit" disabled={isLoading || (mode !== 'SETUP' && !email) || (mode === 'LOGIN' && !password) || (mode === 'SIGNUP' && !name) || (mode === 'SETUP' && (!password || !confirmPassword))}
                                            className={`w-full md:w-[150px] bg-[#F26522] hover:bg-[#d9531a] text-white text-[13px] font-bold py-3.5 rounded-sm shadow-md transition-colors duration-200 ${isLoading ? 'opacity-60 cursor-not-allowed w-full' : ''}`}>
                                            {isLoading ? (language === 'en' ? 'Processing...' : 'Memproses...') : 
                                             (mode === 'LOGIN' ? (language === 'en' ? 'Sign in now' : 'Masuk sekarang') : 
                                              mode === 'SIGNUP' ? (language === 'en' ? 'Request Access' : 'Ajukan Akses') : 
                                              mode === 'SETUP' ? (language === 'en' ? 'Save Password' : 'Simpan Sandi') :
                                              (language === 'en' ? 'Send Request' : 'Kirim Reset'))}
                                        </button>
                                    </div>

                                    {mode !== 'SETUP' && (
                                        <div className="mt-6 md:mt-8 flex flex-col gap-2 animate-fade-up" style={{animationDelay: '400ms'}}>
                                            {mode === 'LOGIN' && <button type="button" onClick={() => setMode('FORGOT')} className="text-[11px] font-bold text-left text-gray-300 hover:text-white transition-colors">{language === 'en' ? 'Lost your password?' : 'Lupa kata sandi?'}</button>}
                                            <button type="button" onClick={() => { setMode(mode === 'LOGIN' ? 'SIGNUP' : 'LOGIN'); setPassword(''); }} className="text-[11px] font-bold text-left text-[#F26522] hover:text-white transition-colors">
                                                {mode === 'LOGIN' ? (language === 'en' ? "Don't have an account? Sign up" : "Belum punya akun? Daftar disini") : 
                                                 (language === 'en' ? "Back to Sign in" : "Kembali ke form Masuk")}
                                            </button>
                                        </div>
                                    )}
                                </form>

                                {mode !== 'SETUP' && (
                                    <div className="mt-10 md:mt-12 text-left w-full animate-fade-up" style={{animationDelay: '500ms'}}>
                                        <p className="text-[10px] text-gray-400 leading-relaxed font-medium">
                                            {language === 'en' ? 'By proceeding you agree to our' : 'Dengan melanjutkan, Anda setuju dengan'}<br/>
                                            <a href="#" className="hover:text-white underline underline-offset-2">Terms of Service</a> | <a href="#" className="hover:text-white underline underline-offset-2">Privacy Policy</a>
                                        </p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const MenuManager = ({ appConfigData, onSave, isSaving }) => {
            const [localApps, setLocalApps] = useState(appConfigData.apps || []);
            const [localAppearance, setLocalAppearance] = useState(appConfigData.loginAppearance || { videoUrl: '', opacity: 25 });
            const [localHeroActions, setLocalHeroActions] = useState(appConfigData.heroActions || []);
            const [localCategories, setLocalCategories] = useState(appConfigData.categories || ['All', 'Permits', 'JSA', 'Safety', 'Reports', 'Inspections', 'Training']);

            useEffect(() => { 
                setLocalApps(appConfigData.apps || []); 
                setLocalAppearance(appConfigData.loginAppearance || { videoUrl: '', opacity: 25 });
                setLocalHeroActions(appConfigData.heroActions || []);
                setLocalCategories(appConfigData.categories || []);
            }, [appConfigData]);

            const handleAppChange = (index, field, value) => {
                const updated = [...localApps];
                updated[index] = { ...updated[index] }; 
                if (field === 'description') { updated[index].description = { id: value, en: value }; }
                else { updated[index][field] = value; }
                setLocalApps(updated);
            };

            const handleSubMenuChange = (appIndex, subIndex, field, value) => {
                const updated = [...localApps];
                updated[appIndex] = { ...updated[appIndex], details: [...(updated[appIndex].details || [])] };
                updated[appIndex].details[subIndex] = { ...updated[appIndex].details[subIndex] };
                if (field === 'title') { updated[appIndex].details[subIndex].title = { id: value, en: value }; }
                else { updated[appIndex].details[subIndex][field] = value; }
                setLocalApps(updated);
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <div>
                            <h2 className="text-xl font-bold text-slate-800">Konfigurasi Modul & UI (DIAS)</h2>
                            <p className="text-sm text-slate-500">Atur struktur menu, tab pencarian, dan banner utama aplikasi.</p>
                        </div>
                        <button onClick={() => onSave({ apps: localApps, loginAppearance: localAppearance, heroActions: localHeroActions, categories: localCategories })} disabled={isSaving} className={`px-6 py-2.5 rounded-xl font-bold text-white transition-all shadow-md ${isSaving ? 'bg-slate-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}>
                            {isSaving ? 'Menyimpan...' : <><i className="fa-solid fa-save mr-2"></i> Simpan Perubahan</>}
                        </button>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                            <h3 className="text-sm font-black text-slate-800 uppercase tracking-widest mb-4"><i className="fa-solid fa-image text-blue-500 mr-2"></i>Tampilan Layar Login (Vopak Tone)</h3>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1.5">URL Video/Gambar Background</label>
                                    <input type="text" value={localAppearance.videoUrl || ''} onChange={(e) => setLocalAppearance({...localAppearance, videoUrl: e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold text-slate-800 focus:border-blue-500 outline-none" placeholder="https://youtube.com/... atau .mp4/.jpg" />
                                    <p className="text-[9px] text-slate-400 mt-1">Layar akan otomatis dilapisi overlay biru Vopak.</p>
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1.5">Opasitas Background Asli ({localAppearance.opacity || 25}%)</label>
                                    <input type="range" min="0" max="100" value={localAppearance.opacity || 25} onChange={(e) => setLocalAppearance({...localAppearance, opacity: parseInt(e.target.value)})} className="w-full accent-blue-600" />
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                            <h3 className="text-sm font-black text-slate-800 uppercase tracking-widest mb-4"><i className="fa-solid fa-tags text-blue-500 mr-2"></i>Pengaturan Kategori Pencarian</h3>
                            <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1.5">Daftar Tab Kategori (Pisahkan dengan koma)</label>
                            <input type="text" value={localCategories.join(', ')} onChange={(e) => setLocalCategories(e.target.value.split(',').map(s => s.trimStart()))} className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold text-slate-800 focus:border-blue-500 outline-none" placeholder="All, Permits, JSA..." />
                        </div>
                    </div>

                    <div className="grid grid-cols-1 gap-6">
                        {localApps.map((app, appIdx) => (
                            <div key={appIdx} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="bg-slate-50 p-4 border-b border-slate-200 flex flex-col lg:flex-row gap-4">
                                    <div className="flex-1 flex flex-col gap-4">
                                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-500 uppercase">Nama Modul</label>
                                                <input type="text" value={app.name} onChange={(e) => handleAppChange(appIdx, 'name', e.target.value)} className="w-full mt-1 p-2 bg-white border border-slate-300 rounded-lg text-sm font-semibold text-slate-800 focus:border-blue-500 outline-none" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-500 uppercase">Deskripsi Singkat</label>
                                                <input type="text" value={app.description?.id || app.description || ''} onChange={(e) => handleAppChange(appIdx, 'description', e.target.value)} className="w-full mt-1 p-2 bg-white border border-slate-300 rounded-lg text-sm font-semibold text-slate-800 focus:border-blue-500 outline-none" placeholder="Tujuan modul..." />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-500 uppercase">App ID (Unik)</label>
                                                <input type="text" value={app.id} onChange={(e) => handleAppChange(appIdx, 'id', e.target.value)} className="w-full mt-1 p-2 bg-white border border-slate-300 rounded-lg text-sm font-semibold text-slate-800 focus:border-blue-500 outline-none" />
                                            </div>
