        const App = () => {

            const [isFirebaseReady, setIsFirebaseReady] = useState(false);
            const [isCheckingAuth, setIsCheckingAuth] = useState(true);
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [isPreloading, setIsPreloading] = useState(false);
            
            const [loginStatus, setLoginStatus] = useState('initial'); 
            const [userPermissions, setUserPermissions] = useState(null); 
            
            const [activeAppId, setActiveAppId] = useState(null);
            const [activeSubItemId, setActiveSubItemId] = useState(null); 
            const [language, setLanguage] = useState('en');
            
            const [isMenuOpen, setMenuOpen] = useState(false);
            const [isMobileSidebarOpen, setMobileSidebarOpen] = useState(false); 
            const [isHelpOpen, setIsHelpOpen] = useState(false); 
            
            const [notifications, setNotifications] = useState([]);
            const [isNotificationOpen, setIsNotificationOpen] = useState(false);
            const [formModalState, setFormModalState] = useState({ isOpen: false, url: '', title: '', permitNumber: '' });
            const [loadedUrls, setLoadedUrls] = useState([]);
            const [loginAppearance, setLoginAppearance] = useState(null);

            const openFormModal = (url, title, permitNumber) => setFormModalState({ isOpen: true, url, title, permitNumber });
            const closeFormModal = () => setFormModalState({ isOpen: false, url: '', title: '', permitNumber: '' });

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        await Promise.all([
                            signInAnonymously(auth),
                            signInAnonymously(ptwAuth)
                        ]);
                    } catch (e) {
                        console.error("Auth error", e);
                    }
                };
                
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    setIsFirebaseReady(true);
                    setIsCheckingAuth(false);
                });

                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;

                const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'config', 'appConfig');
                const unsubConfig = onSnapshot(configRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setApps(data.apps || []);
                        setLoginAppearance(data.loginAppearance || { videoUrl: "https://www.youtube.com/embed/M7lc1UVf-VE?autoplay=1&mute=1&loop=1&playlist=M7lc1UVf-VE&controls=0&playsinline=1&rel=0&showinfo=0&disablekb=1", opacity: 25 });
                    } else {
                        const seedData = initialAppData.filter(a => a.id !== 'home');
                        const seedAppearance = { videoUrl: "https://www.youtube.com/embed/M7lc1UVf-VE?autoplay=1&mute=1&loop=1&playlist=M7lc1UVf-VE&controls=0&playsinline=1&rel=0&showinfo=0&disablekb=1", opacity: 25 };
                        setDoc(configRef, { apps: seedData, loginAppearance: seedAppearance });
                        setApps(seedData);
                        setLoginAppearance(seedAppearance);
                    }
                });

                const usersRef = doc(db, 'artifacts', appId, 'public', 'data', 'config', 'users');
                const unsubUsers = onSnapshot(usersRef, (docSnap) => {
                    if (docSnap.exists()) setUsersConfig(docSnap.data());
                });

                const permitsCol = collection(ptwDb, 'artifacts', ptwAppId, 'public', 'data', 'permits');
                const unsubPermits = onSnapshot(permitsCol, (snapshot) => {
                    if (!snapshot.empty) {
                        const currentPermits = {};
                        snapshot.forEach(doc => { currentPermits[doc.id] = doc.data(); });
                        setPermitsData(currentPermits);
                    } else { setPermitsData({}); }
                }, (error) => console.error("Gagal memuat data permit PTW:", error));

                const jsaCol = collection(ptwDb, 'artifacts', ptwAppId, 'public', 'data', 'jsa');
                const unsubJsa = onSnapshot(jsaCol, (snapshot) => {
                    if (!snapshot.empty) {
                        const currentJsa = {};
                        snapshot.forEach(doc => { currentJsa[doc.id] = doc.data(); });
                        setJsaData(currentJsa);
                    } else { setJsaData({}); }
                }, (error) => console.error("Gagal memuat data JSA PTW:", error));

                const ptwSettingsDoc = doc(ptwDb, 'artifacts', ptwAppId, 'public', 'settings');
                const unsubPtwSettings = onSnapshot(ptwSettingsDoc, (docSnap) => {
                    if (docSnap.exists()) setPtwSettings(docSnap.data());
                }, (error) => console.error("Gagal memuat settings PTW:", error));

                setIsCalendarLoading(true);
                if (typeof google !== 'undefined' && google.script) {
                    // Berjalan di dalam Google Apps Script, panggil fungsi backend
                    google.script.run
                        .withSuccessHandler((events) => {
                            setCalendarEvents(events || []);
                            setIsCalendarLoading(false);
                        })
                        .withFailureHandler((error) => {
                            console.error("Gagal mengambil data dari Google Calendar:", error);
                            setCalendarEvents([]);
                            setIsCalendarLoading(false);
                        })
                        .getUserCalendarEvents(); // <-- Memanggil fungsi dari Code.gs
                } else {
                    // Mode Testing/Lokal: Tampilkan dummy data agar UI bisa dilihat
                    console.log("⚠️ Berjalan di luar Google Apps Script. Menampilkan kalender dummy.");
                    const now = new Date();
                    const dummyEvents = [
                        { title: "Team Weekly Sync", startTime: new Date(now.getTime() + 1 * 60 * 60 * 1000).toISOString() },
                        { title: "Safety Inspection Brief", startTime: new Date(now.getTime() + 3.5 * 60 * 60 * 1000).toISOString() }
                    ];
                    setCalendarEvents(dummyEvents);
                    setIsCalendarLoading(false);
                }

                return () => {
                    unsubConfig();
                    unsubUsers();
                    unsubPermits();
                    unsubJsa();
                    unsubPtwSettings();
                };
            }, [user]);

            // DIUBAH: Jika window.__USER_EMAIL__ kosong atau string template belum terganti ('<?='), paksa default ke 'abdullah.rosprianto@vopak.com'
            const displayUserEmail = typeof window.__USER_EMAIL__ !== 'undefined' && window.__USER_EMAIL__ !== '' && !window.__USER_EMAIL__.includes('<?=') 
                ? window.__USER_EMAIL__ 
                : 'abdullah.rosprianto@vopak.com';

            useEffect(() => {
                if (Object.keys(permitsData).length === 0 && Object.keys(jsaData).length === 0) return;
                
                const newNotifs = [];

                const isNameMatch = (val, email) => {
                    if (!val || !email) return false;
                    const v = val.toString().toLowerCase().trim();
                    const e = email.toLowerCase().trim();
                    if (v === e) return true;
                    const tokens = e.split('@')[0].split('.');
                    return tokens.some(t => t.length >= 3 && (v.includes(t) || t.includes(v)));
                };

                const employees = ptwSettings?.employees || [];
                const me = employees.find(e => e.email.toLowerCase() === displayUserEmail.toLowerCase() || (e.secondaryEmail && e.secondaryEmail.toLowerCase() === displayUserEmail.toLowerCase()));
                const myRoles = me?.systemRoles || (me?.systemRole ? [me.systemRole] : []);

                // Hapus bypass ADMIN untuk notifikasi harian agar ADMIN tidak spam.
                // ADMIN hanya dapat akses menu, tapi notif disesuaikan dengan peran kerja real di lapangan.
                const isUserEngineer = myRoles.includes('ENGINEER');
                const isUserAA = myRoles.includes('AA') || myRoles.includes('AREA_AUTHORITY');
                const isUserTechnician = myRoles.includes('TECHNICIAN');
                const isUserAssessor = myRoles.includes('ASSESSOR');
                const isUserApprover = myRoles.includes('APPROVER');
                const isSuperAdmin = myRoles.includes('ADMIN'); // Simpan jika butuh notifikasi kritis/system

                Object.keys(permitsData).forEach(key => {
                    const permit = permitsData[key];
                    const f1 = permit.file1 || {};
                    
                    if (!permit.permitNumber && !f1.nomorPermit) return;
                    const permitIdShow = permit.permitNumber || f1.nomorPermit;
                    
                    let notifTime = permit.createdAt?.toMillis ? new Date(permit.createdAt.toMillis()).toISOString() : new Date().toISOString();

                    const isJobOwner = isNameMatch(permit.jobOwnerEmail || f1.jobOwnerEmail, displayUserEmail) || isNameMatch(permit.requester?.nama || f1.namaPemohon, displayUserEmail) || myRoles.includes('JOB_OWNER');
                    
                    const techEmail = permit.authorityChecklist?.emailTeknisi || f1.emailTeknisi;
                    const isAssignedTech = isUserTechnician || isNameMatch(techEmail, displayUserEmail);

                    if (permit.stage === 'REQUESTED' && isJobOwner) {
                        newNotifs.push({
                            id: `JO-${permitIdShow}`, appId: 'app_1777363186769', subItemId: 'app_1777363186769', moduleName: 'Permit (Approval)',
                            message: { id: `Permit ${permitIdShow} menunggu persetujuan awal Anda sebagai Pemilik Pekerjaan.`, en: `Permit ${permitIdShow} is waiting for your initial approval as Job Owner.` }, timestamp: notifTime, isRead: false 
                        });
                    }

                    if (permit.stage === 'JOB_OWNER_APPROVED' && isUserEngineer) {
                        if (permit.jobOwnerApproval?.timestamp?.toMillis) notifTime = new Date(permit.jobOwnerApproval.timestamp.toMillis()).toISOString();
                        newNotifs.push({
                            id: `ENG-${permitIdShow}`, appId: 'app_1777363186769', subItemId: 'app_1777363186769', moduleName: 'Permit (Engineer)',
                            message: { id: `Permit ${permitIdShow} menunggu tinjauan dan persetujuan Engineer.`, en: `Permit ${permitIdShow} is waiting for Engineer review and approval.` }, timestamp: notifTime, isRead: false 
                        });
                    }

                    if (permit.stage === 'ENGINEER_APPROVED' && isUserAA) {
                        if (permit.engineerApproval?.timestamp?.toMillis) notifTime = new Date(permit.engineerApproval.timestamp.toMillis()).toISOString();
                        newNotifs.push({
                            id: `AA-ACK-${permitIdShow}`, appId: 'app_1777363186769', subItemId: 'app_1777363186769', moduleName: 'Permit (Otoritas)',
                            message: { id: `Permit ${permitIdShow} siap ditugaskan ke Teknisi (Acknowledge).`, en: `Permit ${permitIdShow} is ready to be assigned to a Technician (Acknowledge).` }, timestamp: notifTime, isRead: false 
                        });
                    }

                    if (permit.stage === 'AA_ACKNOWLEDGED' && isAssignedTech) {
                        if (permit.authorityChecklist?.approvalData?.timestamp?.toMillis) notifTime = new Date(permit.authorityChecklist.approvalData.timestamp.toMillis()).toISOString();
                        newNotifs.push({
                            id: `TECH-ACK-${permitIdShow}`, appId: 'app_1777363186769', subItemId: 'app_1777363186769', moduleName: 'Permit (Teknisi)',
                            message: { id: `Permit ${permitIdShow} ditugaskan kepada Anda untuk inspeksi lapangan dan Gas Test.`, en: `Permit ${permitIdShow} is assigned to you for field inspection and Gas Test.` }, timestamp: notifTime, isRead: false 
                        });
                    }

                    if (permit.stage === 'TECHNICIAN_TESTING_DONE' && isUserAA) {
                        if (permit.technicianApproval?.timestamp?.toMillis) notifTime = new Date(permit.technicianApproval.timestamp.toMillis()).toISOString();
                        newNotifs.push({
                            id: `AA-ONL-${permitIdShow}`, appId: 'app_1777363186769', subItemId: 'app_1777363186769', moduleName: 'Permit (Otoritas)',
                            message: { id: `Gas Test untuk ${permitIdShow} selesai. Menunggu otorisasi ONLINE dari Anda.`, en: `Gas Test for ${permitIdShow} is complete. Waiting for your ONLINE authorization.` }, timestamp: notifTime, isRead: false 
                        });
                    }

                    if (permit.stage === 'CLOSING_REQUESTED' && isUserAA) {
                        if (permit.jobOwnerClosing?.timestamp?.toMillis) notifTime = new Date(permit.jobOwnerClosing.timestamp.toMillis()).toISOString();
                        newNotifs.push({
                            id: `AA-CLS-${permitIdShow}`, appId: 'app_1777363186769', subItemId: 'app_1777363186769', moduleName: 'Permit (Closing)',
                            message: { id: `Permohonan penutupan (Closing) untuk permit ${permitIdShow}. Menunggu finalisasi AA.`, en: `Closing request for permit ${permitIdShow}. Waiting for AA finalization.` }, timestamp: notifTime, isRead: false 
                        });
                    }
                });

                Object.keys(jsaData).forEach(key => {
                    const jsa = jsaData[key];
                    let notifTime = jsa.createdAt?.toMillis ? new Date(jsa.createdAt.toMillis()).toISOString() : new Date().toISOString();
                    
                    if (jsa.state === 'pending') {
                        const currentApproverRole = jsa.chain?.[jsa.currentIndex] || '';
                        let needsMyApproval = false;
                        
                        const roleStr = currentApproverRole.toLowerCase();
                        if ((roleStr.includes('sheq') || roleStr.includes('assessor')) && isUserAssessor) needsMyApproval = true;
                        if ((roleStr.includes('manager') || roleStr.includes('director')) && isUserApprover) needsMyApproval = true;
                        if (roleStr.includes('engineer') && isUserEngineer) needsMyApproval = true;
                        if (isNameMatch(currentApproverRole, displayUserEmail) || isNameMatch(currentApproverRole, me?.name)) needsMyApproval = true;
                        
                        if (needsMyApproval || isSuperAdmin) { // JSA approval logic retains SuperAdmin bypass for now
                             newNotifs.push({
                                id: `JSA-${key}`, appId: 'jsa', subItemId: null, moduleName: 'JSA (Review)',
                                message: { id: `Dokumen JSA ${jsa.data?.jsa_no || key} sedang menunggu tinjauan Anda (${currentApproverRole || 'Otorisator'}).`, en: `JSA Document ${jsa.data?.jsa_no || key} is waiting for your review (${currentApproverRole || 'Authorizer'}).` }, timestamp: notifTime, isRead: false 
                            });
                        }
                    } else if (jsa.state === 'final_review' && isUserApprover) {
                        newNotifs.push({
                            id: `JSA-FIN-${key}`, appId: 'jsa', subItemId: null, moduleName: 'JSA (Final Review)',
                            message: { id: `JSA ${jsa.data?.jsa_no || key} membutuhkan Tinjauan Akhir (Final Review) dari Manager.`, en: `JSA ${jsa.data?.jsa_no || key} requires a Final Review from the Manager.` }, timestamp: notifTime, isRead: false 
                        });
                    }
                });

                setNotifications(prev => {
                    return newNotifs.map(n => {
                        const existing = prev.find(p => p.id === n.id);
                        if (existing) {
                            return { ...n, isRead: existing.isRead, timestamp: existing.timestamp };
                        }
                        return n;
                    }).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                });

            }, [permitsData, jsaData, ptwSettings, displayUserEmail, language]);

            const visibleApps = useMemo(() => {
                if (!isFirebaseReady || !userPermissions) return [];
                let sourceApps = (apps && apps.length > 0) ? apps : initialAppData;
                let filteredApps = sourceApps;
                
                if (userPermissions !== 'ALL') {
                    const permsArray = Array.isArray(userPermissions) ? userPermissions : [];
                    filteredApps = sourceApps.filter(app => permsArray.includes(app.id));
                }
                const dashboardApp = { id: 'home', name: 'Dashboard', description: { id: 'Menu utama sistem.', en: 'Main system dashboard.' }, iconStr: 'home', component: 'SystemDashboard' };
                if (!filteredApps.find(a => a.id === 'home')) filteredApps.unshift(dashboardApp);
                return filteredApps;
            }, [userPermissions, isFirebaseReady, apps]);

            const allUrlsToLoad = useMemo(() => {
                const urls = new Set();
                visibleApps.forEach(app => {
                    if (app.iframeUrl && app.iframeUrl !== '#') urls.add(app.iframeUrl);
                    if (app.details) {
                        app.details.forEach(d => {
                            if (d.link && d.link !== '#' && !d.link.includes('page=map')) urls.add(d.link);
                        });
                    }
                });
                return Array.from(urls);
            }, [visibleApps]);

            const totalUrls = allUrlsToLoad.length;
            const loadedUrlsCount = loadedUrls.length;
            const progressRatio = totalUrls > 0 ? Math.round((loadedUrlsCount / totalUrls) * 100) : 100;

            useEffect(() => { if (isLoggedIn && !activeAppId && visibleApps.length > 0) setActiveAppId(visibleApps[0].id); }, [isLoggedIn, visibleApps]);
            useEffect(() => { setMenuOpen(false); }, [activeAppId]); 

            useEffect(() => {
                if (isPreloading) {
                    const timer = setTimeout(() => { setIsPreloading(false); }, 10000); 
                    return () => clearTimeout(timer);
                }
            }, [isPreloading]);

            useEffect(() => {
                if (isPreloading && totalUrls > 0 && loadedUrlsCount >= totalUrls) {
                    setTimeout(() => setIsPreloading(false), 500); 
                }
            }, [loadedUrlsCount, totalUrls, isPreloading]);

            const handleLoginAttempt = () => {
                setIsCheckingAuth(true);
                
                if (!usersConfig) {
                    setTimeout(() => setIsCheckingAuth(false), 800);
                    return;
                }

                if (usersConfig && displayUserEmail) {
                    const isRegistered = usersConfig.registeredUsers && usersConfig.registeredUsers[displayUserEmail];
                    
                    if (isRegistered) {
                        setUserPermissions(isRegistered.access || 'ALL');
                        setIsLoggedIn(true);
                        setIsPreloading(true);
                        setIsCheckingAuth(false);
                    } else {
                        const hasRequested = usersConfig.pendingRequests && usersConfig.pendingRequests.some(r => r.email === displayUserEmail);
                        setLoginStatus(hasRequested ? 'request_sent' : 'unregistered');
                        setIsCheckingAuth(false);
                    }
                } else if (!displayUserEmail) {
                    handleGuestLogin();
                    setIsCheckingAuth(false);
                }
            };

            const handleGuestLogin = () => {
                setUserPermissions(usersConfig?.guestModules || []);
                setIsLoggedIn(true);
                setIsPreloading(true);
            };

            const handleRequestAccess = async () => {
                setIsCheckingAuth(true);
                if (!user || !displayUserEmail) return;
                
                try {
                    const usersRef = doc(db, 'artifacts', appId, 'public', 'data', 'config', 'users');
                    const currentRequests = usersConfig.pendingRequests || [];
                    
                    if (!currentRequests.some(r => r.email === displayUserEmail)) {
                        const newRequest = { email: displayUserEmail, timestamp: new Date().toISOString(), status: 'pending' };
                        await setDoc(usersRef, { ...usersConfig, pendingRequests: [...currentRequests, newRequest] });
                    }
                    
                    if (typeof google !== 'undefined' && google.script) {
                        google.script.run.sendAdminNotification(displayUserEmail);
                    }
                    
                    setLoginStatus('request_sent');
                } catch(e) {
                    alert(language === 'en' ? "Failed to send request: " + e.message : "Gagal mengirim permintaan: " + e.message);
                } finally {
                    setIsCheckingAuth(false);
                }
            };

            const handleIframeLoaded = useCallback((url) => {
                setLoadedUrls(prev => prev.includes(url) ? prev : [...prev, url]);
            }, []);

            const handleIframeReloaded = useCallback((url) => {
                setLoadedUrls(prev => prev.filter(u => u !== url));
            }, []);

            const activeApp = visibleApps.find(app => app.id === activeAppId);
            
            const activeUrl = useMemo(() => {
                if (!activeApp || activeApp.id === 'home' || activeApp.component) return null;
                if (activeSubItemId) {
                    const sub = activeApp.details?.find(d => d.id === activeSubItemId);
                    return sub && sub.link !== '#' ? sub.link : null;
                }
                return activeApp.details?.length > 0 ? null : (activeApp.iframeUrl !== '#' ? activeApp.iframeUrl : null);
            }, [activeApp, activeSubItemId]);

            const handleSelectApp = useCallback((appId, subItemId = null) => { setActiveAppId(appId); setActiveSubItemId(subItemId); setMenuOpen(false); }, []);

            const currentUserName = usersConfig?.userProfiles?.[displayUserEmail]?.name || '';
            const isConfigLoading = isCheckingAuth || (user && !usersConfig) || (user && !loginAppearance);

            if (!isLoggedIn) return <LoginPage onLogin={handleLoginAttempt} onGuestLogin={handleGuestLogin} onRequestAccess={handleRequestAccess} userEmail={displayUserEmail} userName={currentUserName} isLoading={isConfigLoading} loginStatus={loginStatus} loginAppearance={loginAppearance} language={language} />;

            const isHomeActive = activeApp?.id === 'home';
            const isUnifiedActive = !isHomeActive;
            const unreadCount = notifications.filter(n => !n.isRead).length;

            return (
                <ErrorBoundary>
                    {isPreloading && (
                        <SplashScreen 
                            progress={progressRatio} 
                            total={totalUrls} 
                            loaded={loadedUrlsCount} 
                            moduleCount={visibleApps.filter(a => a.id !== 'home').length}
                            onSkip={() => setIsPreloading(false)} 
                            language={language}
                        />
                    )}

                    <div className="h-full w-full flex bg-[#F8FAFC] overflow-hidden font-sans relative">
                        
                        {isMobileSidebarOpen && (
                            <div 
                                className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[90] md:hidden transition-opacity" 
                                onClick={() => setMobileSidebarOpen(false)}
                            ></div>
                        )}

                        <Sidebar 
                            apps={visibleApps} 
                            activeAppId={activeAppId} 
                            onSelectApp={handleSelectApp} 
                            language={language} setLanguage={setLanguage}
                            onLogout={() => setIsLoggedIn(false)}
                            setMenuOpen={setMenuOpen} notifications={notifications} setIsNotificationOpen={setIsNotificationOpen}
                            isMobileSidebarOpen={isMobileSidebarOpen} setMobileSidebarOpen={setMobileSidebarOpen}
                        />

                        <NotificationPanel 
                            isOpen={isNotificationOpen} onClose={() => setIsNotificationOpen(false)} notifications={notifications}
                            markAsRead={(id) => setNotifications(prev => prev.map(n => n.id === id ? { ...n, isRead: true } : n))} onSelectApp={handleSelectApp} onOpenForm={openFormModal} language={language}
                        />
                        
                        <main className="flex-1 flex flex-col h-full relative overflow-hidden w-full">
                            
                            <div className="md:hidden flex items-center justify-between bg-white/90 backdrop-blur-md h-16 px-4 border-b border-slate-200 z-40 shrink-0 shadow-sm relative">
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setMobileSidebarOpen(true)} className="p-2 -ml-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
                                        <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>
                                    </button>
                                    <div className="flex items-center justify-center pt-1 w-24">
                                        <VopakLogo className="h-6 w-auto object-contain" />
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button onClick={() => setIsNotificationOpen(true)} className="relative p-2 text-slate-500 hover:text-indigo-600 transition-colors">
                                        <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                                        </svg>
                                        {unreadCount > 0 && (
                                            <span className="absolute top-1.5 right-1.5 flex h-2.5 w-2.5">
                                                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                                                <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500 border-2 border-white"></span>
                                            </span>
                                        )}
                                    </button>
                                </div>
                            </div>

                            <div className={`absolute md:inset-0 top-16 bottom-0 right-0 left-0 transition-opacity duration-300 w-full h-full p-4 md:p-8 lg:p-10 overflow-y-auto hide-scrollbar ${isHomeActive ? 'z-20 opacity-100 pointer-events-auto' : 'z-0 opacity-0 pointer-events-none'}`}>
                                {isHomeActive && <SystemDashboard allApps={visibleApps} onSelectApp={handleSelectApp} userEmail={displayUserEmail} userName={currentUserName} language={language} permitsData={permitsData} calendarEvents={calendarEvents} loadingEvents={isCalendarLoading} notifications={notifications} />}
                            </div>

                            <div className={`absolute md:inset-0 top-16 bottom-0 right-0 left-0 transition-opacity duration-300 w-full h-full ${isUnifiedActive ? 'z-20 opacity-100 pointer-events-auto' : 'z-0 opacity-0 pointer-events-none'}`}>
                                <UnifiedDashboard 
                                    language={language} 
                                    displayApp={activeApp?.id === 'home' ? visibleApps.find(a => a.id !== 'home') : activeApp}
                                    isUnified={isUnifiedActive}
                                    allUrls={allUrlsToLoad}
                                    loadedUrls={loadedUrls}
                                    onIframeLoad={handleIframeLoaded}
                                    onIframeReload={handleIframeReloaded}
                                    activeUrl={activeUrl}
                                    onSelectApp={handleSelectApp}
                                    activeSubItemId={activeSubItemId}
                                    isMenuOpen={isMenuOpen}
                                    setMenuOpen={setMenuOpen}
                                    notifications={notifications}
                                />
                            </div>

                        </main>

                        <FormModal isOpen={formModalState.isOpen} onClose={closeFormModal} data={formModalState} language={language} />
                        <HelpDeskModal isOpen={isHelpOpen} onClose={() => setIsHelpOpen(false)} userEmail={displayUserEmail} language={language} />

                        <div className="fixed bottom-6 right-6 md:bottom-8 md:right-8 flex flex-col items-center space-y-3 md:space-y-4 z-[60]">
                            <button
                                onClick={() => setIsHelpOpen(true)}
                                className="p-3 md:p-3.5 rounded-full bg-rose-500 text-white backdrop-blur-md border border-rose-300/30 shadow-xl shadow-rose-500/20 hover:bg-rose-600 hover:shadow-rose-600/40 hover:scale-110 opacity-70 hover:opacity-100 transition-all duration-300 flex items-center justify-center group"
                                title={language === 'en' ? 'IT Help Desk / Report Issue' : 'Lapor Kendala / IT Help Desk'}
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 md:h-6 md:w-6 transition-transform group-hover:rotate-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z" />
                                </svg>
                            </button>

                            {!isHomeActive && (
                                <button
                                    onClick={() => handleSelectApp('home')}
                                    className="p-3.5 md:p-4 rounded-full bg-indigo-600 text-white backdrop-blur-md border border-indigo-300/30 shadow-xl shadow-indigo-500/20 hover:bg-indigo-700 hover:shadow-indigo-600/40 hover:scale-110 opacity-80 hover:opacity-100 transition-all duration-300 flex items-center justify-center group animate-fade-up"
                                    title={language === 'en' ? 'Back to Main Dashboard' : 'Kembali ke Dashboard Utama'}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 md:h-7 md:w-7 transition-transform group-hover:-translate-y-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                        <path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 001 1m-6 0h6" />
                                    </svg>
                                </button>
                            )}
                        </div>
                    </div>
                </ErrorBoundary>
            );
        };
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>
</body>
</html>
