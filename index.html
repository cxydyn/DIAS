            const [allJsas, setAllJsas] = useState([]); 
            const [locationCoords, setLocationCoords] = useState({});
            const [mapType, setMapType] = useState('terminal'); 
            
            const [activeModule, setActiveModule] = useState('PTW'); 
            const [currentFolder, setCurrentFolder] = useState('root');
            const [viewingPermit, setViewingPermit] = useState(null);

            useEffect(() => {
                const unsubConfig = onSnapshot(doc(diasDb, 'artifacts', DIAS_APP_ID, 'public', 'data', 'config', 'appConfig'), (docSnap) => {
                    if (docSnap.exists()) setAppConfigData(docSnap.data());
                });
                const unsubUsers = onSnapshot(doc(diasDb, 'artifacts', DIAS_APP_ID, 'public', 'data', 'config', 'users'), (docSnap) => {
                    if (docSnap.exists()) setUsersConfig(docSnap.data());
                });
                const unsubPermits = onSnapshot(collection(ptwDb, 'artifacts', PTW_APP_ID, 'public', 'data', 'permits'), (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    data.sort((a, b) => (b.createdAt?.toMillis ? b.createdAt.toMillis() : 0) - (a.createdAt?.toMillis ? a.createdAt.toMillis() : 0));
                    setAllPermits(data);
                });
                const unsubJsa = onSnapshot(collection(ptwDb, 'artifacts', PTW_APP_ID, 'public', 'data', 'jsa'), (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    data.sort((a, b) => (b.createdAt?.toMillis ? b.createdAt.toMillis() : 0) - (a.createdAt?.toMillis ? a.createdAt.toMillis() : 0));
                    setAllJsas(data);
                });
                const unsubSettings = onSnapshot(doc(ptwDb, 'artifacts', PTW_APP_ID, 'public', 'settings'), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setEmployees(data.employees || []);
                        setLocationCoords(data.locations || DEFAULT_LOCATION_MAP);
                    }
                });

                return () => { unsubConfig(); unsubUsers(); unsubPermits(); unsubJsa(); unsubSettings(); };
            }, []);

            const saveAppConfig = async (newConfigData) => {
                setIsSaving(true);
                try {
                    await setDoc(doc(diasDb, 'artifacts', DIAS_APP_ID, 'public', 'data', 'config', 'appConfig'), newConfigData, { merge: true });
                    showToast("Konfigurasi modul berhasil disimpan!");
                } catch (e) { showToast("Gagal menyimpan: " + e.message); }
                setIsSaving(false);
            };

            const saveUsersConfig = async (newUsersConfig) => {
                setIsSaving(true);
                try {
                    await setDoc(doc(diasDb, 'artifacts', DIAS_APP_ID, 'public', 'data', 'config', 'users'), newUsersConfig);
                    showToast("Hak akses pengguna diperbarui!");
                } catch (e) { showToast("Gagal menyimpan: " + e.message); }
                setIsSaving(false);
            };

            const savePtwSettings = async (newData) => {
                try {
                    await setDoc(doc(ptwDb, 'artifacts', PTW_APP_ID, 'public', 'settings'), newData, { merge: true });
                } catch (e) { showToast("Gagal menyimpan data karyawan: " + e.message); }
            };

            const activePermits = allPermits.filter(p => p.status === 'PROSES' || p.status === 'ONLINE');
            const archivedPermits = allPermits.filter(p => p.status === 'CLOSED' || p.status === 'CANCELLED' || p.stage === 'REJECTED' || p.stage === 'DELETED');
            const activeJsas = allJsas.filter(j => ['pending', 'final_review', 'extension_review', 'valid', 'expired'].includes(j.state));
            const archivedJsas = allJsas.filter(j => ['completed', 'rejected', 'cancelled', 'deleted'].includes(j.state));

            const groupedPermits = activePermits.reduce((acc, p) => {
                const loc = p.details?.lokasi;
                if (loc) { if (!acc[loc]) acc[loc] = []; acc[loc].push(p); }
                return acc;
            }, {});

            const handleRevertPermit = (permit) => {
                openDialog("Kembalikan status permit ini ke tahap sebelumnya?", async () => {
                    const stageOrder = ['REQUESTED', 'JOB_OWNER_APPROVED', 'ENGINEER_APPROVED', 'AA_ACKNOWLEDGED', 'TECHNICIAN_TESTING_DONE', 'ONLINE', 'CLOSING_REQUESTED', 'CLOSED'];
                    const currentIndex = stageOrder.indexOf(permit.stage);
                    if (currentIndex <= 0) return showToast("Permit ini masih berada di tahap paling awal.");
                    const previousStage = stageOrder[currentIndex - 1];
                    
                    try {
                        const permitRef = doc(ptwDb, 'artifacts', PTW_APP_ID, 'public', 'data', 'permits', permit.id);
                        let payload = { stage: previousStage, status: previousStage === 'ONLINE' ? 'ONLINE' : 'PROSES' };

                        if (permit.stage === 'JOB_OWNER_APPROVED') payload.jobOwnerApproval = deleteField();
                        else if (permit.stage === 'ENGINEER_APPROVED') payload.engineerApproval = deleteField();
                        else if (permit.stage === 'AA_ACKNOWLEDGED') payload.authorityChecklist = deleteField();
                        else if (permit.stage === 'TECHNICIAN_TESTING_DONE') { payload.technicianApproval = deleteField(); payload.gasTest = deleteField(); }
                        else if (permit.stage === 'ONLINE') payload.authorityApproval = deleteField();
                        else if (permit.stage === 'CLOSING_REQUESTED') payload.jobOwnerClosing = deleteField();
                        
                        payload.lastRevertedBy = "Admin";
                        payload.lastRevertedAt = serverTimestamp();
                        
                        await updateDoc(permitRef, payload);
                        showToast(`Status dikembalikan ke ${previousStage.replace(/_/g, ' ')}`);
                    } catch (e) { showToast("Gagal: " + e.message); }
                });
            };

            const renderExplorer = () => {
                let closedItems = []; let rejectedItems = []; let cancelledItems = [];
                if (activeModule === 'PTW') {
                    closedItems = archivedPermits.filter(p => p.stage === 'CLOSED');
                    rejectedItems = archivedPermits.filter(p => p.stage === 'REJECTED');
                    cancelledItems = archivedPermits.filter(p => p.stage === 'CANCELLED' || p.stage === 'DELETED');
                } else {
                    closedItems = archivedJsas.filter(j => j.state === 'completed');
                    rejectedItems = archivedJsas.filter(j => j.state === 'rejected');
                    cancelledItems = archivedJsas.filter(j => j.state === 'cancelled' || j.state === 'deleted');
                }

                let currentFiles = []; let folderTitle = '';
                if (currentFolder === 'CLOSED') { currentFiles = closedItems; folderTitle = 'Selesai (Closed)'; }
                if (currentFolder === 'REJECTED') { currentFiles = rejectedItems; folderTitle = 'Ditolak (Rejected)'; }
                if (currentFolder === 'CANCELLED') { currentFiles = cancelledItems; folderTitle = 'Dibatalkan/Dihapus'; }

                return (
                    <div className="bg-white border border-slate-200 rounded-2xl shadow-sm flex flex-col h-full overflow-hidden">
                        <div className="bg-slate-50 px-5 py-3 border-b border-slate-200 flex items-center gap-4 shrink-0">
                            <button onClick={() => setCurrentFolder('root')} disabled={currentFolder === 'root'} className={`w-8 h-8 rounded flex items-center justify-center transition-colors shrink-0 ${currentFolder === 'root' ? 'text-slate-300' : 'text-slate-600 hover:bg-slate-200'}`}>
                                <i className="fa-solid fa-arrow-up"></i>
                            </button>
                            <div className="flex-1 bg-white border border-slate-300 rounded-lg px-4 py-2 text-sm font-bold flex items-center gap-3 shadow-inner text-slate-600">
                                <i className="fa-solid fa-hard-drive text-slate-400"></i>
                                Arsip {activeModule} {currentFolder !== 'root' ? <><i className="fa-solid fa-chevron-right text-[10px] mx-2 opacity-50"></i> {folderTitle}</> : ''}
                            </div>
                        </div>
                        <div className="p-6 flex-1 overflow-y-auto bg-slate-50/50 flex flex-wrap gap-6 content-start custom-scrollbar">
                            {currentFolder === 'root' ? (
                                <>
                                    <div onClick={() => setCurrentFolder('CLOSED')} className="w-36 h-36 flex flex-col items-center justify-center gap-3 p-4 rounded-xl hover:bg-blue-50 cursor-pointer transition-colors border border-transparent hover:border-blue-200 group">
                                        <i className="fa-solid fa-folder folder-icon text-7xl group-hover:scale-105 transition-transform"></i>
                                        <div className="text-center"><p className="text-xs font-black text-slate-700 leading-tight">Selesai (Closed)</p><p className="text-[10px] font-bold text-slate-400">{closedItems.length} Dok</p></div>
                                    </div>
                                    <div onClick={() => setCurrentFolder('REJECTED')} className="w-36 h-36 flex flex-col items-center justify-center gap-3 p-4 rounded-xl hover:bg-rose-50 cursor-pointer transition-colors border border-transparent hover:border-rose-200 group">
                                        <i className="fa-solid fa-folder text-7xl group-hover:scale-105 transition-transform text-red-400 shadow-sm"></i>
                                        <div className="text-center"><p className="text-xs font-black text-slate-700 leading-tight">Ditolak (Rejected)</p><p className="text-[10px] font-bold text-slate-400">{rejectedItems.length} Dok</p></div>
                                    </div>
                                    <div onClick={() => setCurrentFolder('CANCELLED')} className="w-36 h-36 flex flex-col items-center justify-center gap-3 p-4 rounded-xl hover:bg-amber-50 cursor-pointer transition-colors border border-transparent hover:border-amber-200 group">
                                        <i className="fa-solid fa-folder text-7xl group-hover:scale-105 transition-transform text-slate-400 shadow-sm"></i>
                                        <div className="text-center"><p className="text-xs font-black text-slate-700 leading-tight">Dibatalkan</p><p className="text-[10px] font-bold text-slate-400">{cancelledItems.length} Dok</p></div>
                                    </div>
                                </>
                            ) : (
                                <>
                                    {currentFiles.length === 0 ? (
                                        <div className="w-full text-center py-20 opacity-50"><i className="fa-regular fa-folder-open text-6xl mb-4 text-slate-400"></i><p className="text-sm font-bold uppercase tracking-widest text-slate-500">Folder Kosong</p></div>
                                    ) : (
                                        currentFiles.map(doc => (
                                            <div key={doc.id} onClick={() => activeModule === 'PTW' ? setViewingPermit(doc) : null} className="w-40 flex flex-col items-center p-3 rounded-xl hover:bg-blue-50 cursor-pointer transition-colors border border-transparent hover:border-blue-200 group text-center">
                                                <i className="fa-solid fa-file-lines text-6xl file-icon group-hover:scale-105 transition-transform mb-3"></i>
                                                <p className="text-[11px] font-black text-slate-800 leading-tight w-full truncate">{activeModule === 'PTW' ? doc.permitNumber : (doc.data?.jsa_no || doc.id)}</p>
                                                <p className="text-[9px] font-bold text-slate-500 truncate w-full">{doc.createdAt?.toMillis ? new Date(doc.createdAt.toMillis()).toLocaleDateString('id-ID') : '-'}</p>
                                            </div>
                                        ))
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="h-full w-full flex bg-slate-900 admin-view text-slate-800 font-admin absolute inset-0 z-50 overflow-hidden">
                    
                    <aside className="w-[280px] bg-slate-900 text-slate-300 flex flex-col shadow-2xl z-20 h-full border-r border-slate-700">
                        <div className="p-6 border-b border-slate-800 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-xl text-white shadow-lg"><i className="fa-solid fa-shield-halved"></i></div>
                                <div><h1 className="text-base font-black tracking-widest uppercase text-white leading-tight">DIAS</h1><p className="text-[9px] text-blue-400 font-bold uppercase tracking-widest">Admin Console</p></div>
                            </div>
                        </div>
                        <div className="p-4 flex-1 space-y-2 overflow-y-auto custom-scrollbar">
                            <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest px-4 mt-2 mb-2">Portal Hub</p>
                            <button onClick={() => setActiveTab('menu')} className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-colors ${activeTab === 'menu' ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800'}`}><i className="fa-solid fa-bars-staggered w-5 text-center"></i> <span className="font-bold text-sm">Konfigurasi Modul</span></button>
                            <button onClick={() => setActiveTab('users')} className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-colors ${activeTab === 'users' ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800'}`}>
                                <i className="fa-solid fa-users-gear w-5 text-center"></i> <span className="font-bold text-sm">Akses & SSO</span>
                                {usersConfig?.pendingRequests?.length > 0 && <span className="ml-auto bg-orange-500 text-white text-[10px] px-1.5 py-0.5 rounded-full">{usersConfig.pendingRequests.length}</span>}
                            </button>

                            <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest px-4 mt-6 mb-2">Sistem PTW</p>
                            <button onClick={() => setActiveTab('active')} className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-colors ${activeTab === 'active' ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800'}`}><i className="fa-solid fa-bolt w-5 text-center"></i> <span className="font-bold text-sm">Dokumen Aktif</span></button>
                            <button onClick={() => setActiveTab('archive')} className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-colors ${activeTab === 'archive' ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800'}`}><i className="fa-regular fa-folder-open w-5 text-center"></i> <span className="font-bold text-sm">Arsip Explorer</span></button>
                            <button onClick={() => setActiveTab('audit')} className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-colors ${activeTab === 'audit' ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800'}`}><i className="fa-solid fa-chart-line w-5 text-center"></i> <span className="font-bold text-sm">Audit Log</span></button>
                            <button onClick={() => setActiveTab('map')} className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-colors ${activeTab === 'map' ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800'}`}><i className="fa-solid fa-map-location-dot w-5 text-center"></i> <span className="font-bold text-sm">Peta Tracker</span></button>
                            <button onClick={() => setActiveTab('settings')} className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-colors ${activeTab === 'settings' ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800'}`}><i className="fa-solid fa-address-book w-5 text-center"></i> <span className="font-bold text-sm">Data Karyawan</span></button>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col h-full overflow-hidden bg-slate-100 rounded-l-3xl shadow-[0_0_40px_rgba(0,0,0,0.1)] z-30">
                        <header className="bg-white px-8 py-5 flex items-center justify-between shadow-sm z-10 border-b border-slate-200">
                            <div className="flex items-center gap-4">
                                <button onClick={onClose} className="w-10 h-10 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-full flex items-center justify-center transition-colors"><i className="fa-solid fa-arrow-left"></i></button>
                                <h2 className="text-2xl font-black text-slate-800 tracking-tight">
                                    {activeTab === 'menu' && 'Konfigurasi Antarmuka UI'}
                                    {activeTab === 'users' && 'SSO & Kontrol Akses'}
                                    {activeTab === 'active' && 'Pemantauan Dokumen Aktif'}
                                    {activeTab === 'archive' && 'Penjelajah Arsip Dokumen'}
                                    {activeTab === 'audit' && 'Laporan & Audit Log'}
                                    {activeTab === 'map' && 'Live Tracker Fasilitas'}
                                    {activeTab === 'settings' && 'Database Master Karyawan'}
                                </h2>
                            </div>
                            {['active', 'archive', 'audit'].includes(activeTab) && (
                                <div className="flex bg-slate-100 p-1.5 rounded-xl border border-slate-200 shadow-inner">
                                    <button onClick={() => setActiveModule('PTW')} className={`px-6 py-2 rounded-lg text-xs font-black uppercase tracking-widest transition-all ${activeModule === 'PTW' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500 hover:bg-slate-200'}`}>Permit to Work</button>
                                    <button onClick={() => setActiveModule('JSA')} className={`px-6 py-2 rounded-lg text-xs font-black uppercase tracking-widest transition-all ${activeModule === 'JSA' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:bg-slate-200'}`}>Job Safety Analysis</button>
                                </div>
                            )}
                        </header>

                        <div className="flex-1 p-8 overflow-y-auto custom-scrollbar">
                            {activeTab === 'menu' && <MenuManager appConfigData={appConfigData} onSave={saveAppConfig} isSaving={isSaving} />}
                            {activeTab === 'users' && <AccessManager usersConfig={usersConfig} appsData={currentApps} onSaveConfig={saveUsersConfig} isSaving={isSaving} employees={employees} openDialog={openDialog} showToast={showToast} />}
                            {activeTab === 'settings' && <EmployeeManager employees={employees} onSaveSettings={savePtwSettings} openDialog={openDialog} showToast={showToast} />}
                            
                            {activeTab === 'active' && (
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col flex-1 min-h-[500px]">
                                    <div className="bg-slate-50 border-b border-slate-200 p-4 flex justify-between items-center">
                                        <p className="font-black text-slate-600 uppercase tracking-widest text-xs">Total Aktif: <span className="text-blue-600 text-lg">{activeModule === 'PTW' ? activePermits.length : activeJsas.length}</span></p>
                                    </div>
                                    <div className="overflow-auto custom-scrollbar flex-1">
                                        <table className="w-full text-left border-collapse min-w-[800px]">
                                            <thead>
                                                <tr className="bg-white border-b border-slate-200 text-[10px] font-black text-slate-500 uppercase tracking-widest sticky top-0 z-10 shadow-sm">
                                                    <th className="p-4 pl-6">Detail Dokumen</th>
                                                    <th className="p-4">Informasi Pekerjaan</th>
                                                    <th className="p-4">Status</th>
                                                    <th className="p-4 text-right pr-6">Tindakan Admin</th>
                                                </tr>
                                            </thead>
                                            <tbody className="text-sm">
                                                {activeModule === 'PTW' ? (
                                                    activePermits.map(p => (
                                                        <tr key={p.id} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                            <td className="p-4 pl-6">
                                                                <p className="font-black text-slate-800 text-base">{p.permitNumber}</p>
                                                                <p className="text-[10px] font-bold text-slate-500 uppercase mt-1">{p.type}</p>
                                                            </td>
                                                            <td className="p-4">
                                                                <p className="font-black text-slate-700">{p.requester?.nama}</p>
                                                                <p className="text-[10px] text-blue-600 bg-blue-50 px-2 py-1 rounded inline-block mt-1 font-bold"><i className="fa-solid fa-location-dot text-rose-500 mr-1"></i> {p.details?.lokasi}</p>
                                                            </td>
                                                            <td className="p-4">
                                                                <span className={`px-2 py-1 rounded text-[10px] font-black uppercase border ${p.status === 'ONLINE' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-orange-50 text-orange-600 border-orange-200'}`}>{p.status}</span>
                                                                <p className="text-[9px] font-bold text-slate-500 uppercase tracking-wider mt-1">{p.stage.replace(/_/g, ' ')}</p>
                                                            </td>
                                                            <td className="p-4 pr-6 text-right">
                                                                <div className="flex justify-end gap-2">
                                                                    <button onClick={() => setViewingPermit(p)} className="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white transition-colors border border-blue-200"><i className="fa-solid fa-folder-open"></i></button>
                                                                    <button onClick={() => handleRevertPermit(p)} className="w-8 h-8 rounded-lg bg-purple-50 text-purple-600 hover:bg-purple-600 hover:text-white transition-colors border border-purple-200"><i className="fa-solid fa-clock-rotate-left"></i></button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))
                                                ) : (
                                                    activeJsas.map(j => (
                                                        <tr key={j.id} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                            <td className="p-4 pl-6">
                                                                <p className="font-black text-slate-800 text-base">{j.data?.jsa_no || j.id}</p>
                                                                <p className="text-[10px] font-bold text-slate-500 uppercase mt-1">{j.data?.type_of_work}</p>
                                                            </td>
                                                            <td className="p-4">
                                                                <p className="font-black text-slate-700">{j.requestor}</p>
                                                                <p className="text-[10px] text-emerald-600 bg-emerald-50 px-2 py-1 rounded inline-block mt-1 font-bold"><i className="fa-solid fa-location-dot text-rose-500 mr-1"></i> {j.data?.exact_location}</p>
                                                            </td>
                                                            <td className="p-4">
                                                                <span className={`px-2 py-1 rounded text-[10px] font-black uppercase border ${j.state === 'valid' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-amber-50 text-amber-600 border-amber-200'}`}>{j.state.replace(/_/g, ' ')}</span>
                                                            </td>
                                                            <td className="p-4 pr-6 text-right">-</td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'archive' && renderExplorer()}
                            
                            {activeTab === 'map' && (
                                <div className="flex-1 h-full flex flex-col lg:flex-row gap-6">
                                    <div className="w-full lg:w-1/3 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                        <div className="bg-slate-50 px-5 py-4 border-b border-slate-200"><h3 className="font-black text-slate-800 uppercase tracking-widest text-xs">Daftar Titik Peta</h3></div>
                                        <div className="p-5 flex-1 overflow-y-auto max-h-[500px]">
                                            <select value={mapType} onChange={e=>setMapType(e.target.value)} className="w-full p-3 mb-4 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold outline-none">
                                                <option value="terminal">Area Terminal</option>
                                                <option value="jetty">Area Jetty</option>
                                            </select>
                                            {Object.entries(locationCoords).filter(c => c[1].type === mapType).map(([name, coords]) => (
                                                <div key={name} className="px-4 py-3 rounded-xl border border-slate-200 mb-2 bg-slate-50 flex justify-between items-center">
                                                    <span className="text-xs font-black text-slate-700">{name}</span>
                                                    <span className="text-[10px] font-bold text-slate-400">{coords.x}%, {coords.y}%</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="w-full lg:w-2/3 h-full bg-slate-200 rounded-2xl overflow-auto border border-slate-300 relative shadow-inner text-center min-h-[500px]">
                                        <img src={MAP_IMAGES[mapType]} alt="Map" className="min-w-[800px] inline-block pointer-events-none select-none" />
                                        {Object.entries(groupedPermits).map(([locName, permitsInLoc], i) => {
                                            const coords = locationCoords[locName];
                                            if (!coords || coords.type !== mapType) return null;
                                            return (
                                                <div key={i} className="absolute transform -translate-x-1/2 -translate-y-1/2 z-20 group" style={{left: `${coords.x}%`, top: `${coords.y}%`}}>
                                                    <div className="w-6 h-6 bg-red-600 rounded-full border-2 border-white map-marker-pulse shadow-lg"></div>
                                                    <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 bg-black/80 text-white text-[10px] px-2 py-1 rounded whitespace-nowrap opacity-0 group-hover:opacity-100">{locName} ({permitsInLoc.length} Aktif)</div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'audit' && (
                                <div className="flex-1 flex flex-col h-full bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                     <div className="bg-slate-50 px-5 py-4 border-b border-slate-200"><h3 className="font-black text-slate-800 uppercase tracking-widest text-xs">Audit Log AktifITAS</h3></div>
                                     <div className="p-6 text-center opacity-50 flex-1 flex flex-col justify-center items-center">
                                         <i className="fa-solid fa-chart-line text-6xl mb-4 text-slate-400"></i>
                                         <p className="text-sm font-bold uppercase tracking-widest text-slate-500">Gunakan CSV Export (Dalam Pengembangan)</p>
                                     </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* MODAL JEJAK AUDIT PTW */}
                    {viewingPermit && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[120] flex items-center justify-center p-4">
                            <div className="bg-slate-50 rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden animate-in zoom-in-95 duration-200">
                                <div className="bg-white px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                                    <h3 className="font-black text-lg text-slate-800"><i className="fa-solid fa-folder-open text-blue-500 mr-2"></i> Detail Izin: {viewingPermit.permitNumber}</h3>
                                    <button onClick={() => setViewingPermit(null)} className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="p-6">
                                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Status Saat Ini</p>
                                    <p className="font-black text-slate-700 mb-4">{viewingPermit.stage.replace(/_/g, ' ')}</p>
                                    
                                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Lokasi</p>
                                    <p className="font-black text-slate-700 mb-4">{viewingPermit.details?.lokasi}</p>
                                    
                                    {(viewingPermit.finalPdfUrl || viewingPermit.pdfUrl) && (
                                        <a href={viewingPermit.finalPdfUrl || viewingPermit.pdfUrl} target="_blank" className="bg-emerald-500 text-white text-xs font-black uppercase px-4 py-3 rounded-xl block text-center mt-4">Unduh Dokumen PDF</a>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };


        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [userEmail, setUserEmail] = useState('');
            const [apps, setApps] = useState([]);
            const [usersConfig, setUsersConfig] = useState(null);
            const [userPermissions, setUserPermissions] = useState(null);
            const [isAdminUser, setIsAdminUser] = useState(false);
            
            const [isFirebaseReady, setIsFirebaseReady] = useState(false);
            const [isAuthChecking, setIsAuthChecking] = useState(true);
            
            const [activeAppId, setActiveAppId] = useState('home');
            const [activeSubItemId, setActiveSubItemId] = useState(null);
            
            // Atur default sidebar tertutup di HP
            const [isSidebarExpanded, setIsSidebarExpanded] = useState(window.innerWidth > 768);
            
            const [searchQuery, setSearchQuery] = useState('');
            const [language, setLanguage] = useState('en');
            const [loginAppearance, setLoginAppearance] = useState({ videoUrl: '', opacity: 25 });
            
            const [aiGreeting, setAiGreeting] = useState('');
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [permitsData, setPermitsData] = useState({});
            const [ptwEmployees, setPtwEmployees] = useState([]);
            const [realNotifications, setRealNotifications] = useState([]);
            const [readNotifIds, setReadNotifIds] = useState(new Set());
            const [toasts, setToasts] = useState([]);
            const [dialogState, setDialogState] = useState({ isOpen: false, message: '', onConfirm: null });
            
            const [isPreloading, setIsPreloading] = useState(false);
            const [preloadProgress, setPreloadProgress] = useState(0);

            const [loginMode, setLoginMode] = useState('LOGIN'); 
            const [pendingSetupEmail, setPendingSetupEmail] = useState('');
            
            const [deferredPrompt, setDeferredPrompt] = useState(null);

            const userName = userEmail.split('@')[0] || 'User';

            // PWA Install Event Listener (Versi Diperbaiki)
            useEffect(() => {
                // Cek apakah event sudah ditangkap oleh script global di <head>
                if (window.pwaInstallPrompt) {
                    setDeferredPrompt(window.pwaInstallPrompt);
                }
                
                // Dengarkan jika event menembak terlambat
                const handlePwaReady = () => {
                    setDeferredPrompt(window.pwaInstallPrompt);
                };
                
                window.addEventListener('pwaReady', handlePwaReady);
                return () => window.removeEventListener('pwaReady', handlePwaReady);
            }, []);

            const handleInstallPwa = () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt(); // Tampilkan prompt instalasi PWA
                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            showToast(language === 'en' ? 'Installing Workspace...' : 'Menginstal Workspace...');
                        }
                        setDeferredPrompt(null);
                    });
                }
            };

            const showToast = useCallback((message) => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
            }, []);

            const openDialog = useCallback((message, onConfirm) => {
                setDialogState({
                    isOpen: true,
                    message,
                    onConfirm: () => {
                        onConfirm();
                        setDialogState({ isOpen: false, message: '', onConfirm: null });
                    }
                });
            }, []);

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        await Promise.all([ signInAnonymously(diasAuth), signInAnonymously(ptwAuth) ]);
                        setIsFirebaseReady(true);
                        
                        const savedSession = localStorage.getItem('dias_session');
                        if (savedSession) {
                            try {
                                const parsed = JSON.parse(savedSession);
                                if (parsed.email && parsed.expiry > Date.now()) {
                                    setTimeout(() => handleLogin(parsed.email, parsed.password, true, true), 1000);
                                    return; 
                                }
                            } catch(e) {}
                        }
                    } catch (e) {
                        console.error("Auth error", e);
                        showToast('Firebase connection failed.');
                    } 
                    setIsAuthChecking(false);
                };
                initAuth();
            }, []);

            useEffect(() => {
                if (!isFirebaseReady) return;

                const unsubConfig = onSnapshot(doc(diasDb, 'artifacts', DIAS_APP_ID, 'public', 'data', 'config', 'appConfig'), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        const dashboardApp = { id: 'home', name: 'Dashboard', iconStr: 'home' };
                        setApps([dashboardApp, ...(data.apps || [])]);
                        if(data.loginAppearance) setLoginAppearance(data.loginAppearance);
                    }
                });
                const unsubUsers = onSnapshot(doc(diasDb, 'artifacts', DIAS_APP_ID, 'public', 'data', 'config', 'users'), (docSnap) => {
                    if (docSnap.exists()) setUsersConfig(docSnap.data() || { registeredUsers: {}, pendingRequests: [] });
                });
                const unsubPermits = onSnapshot(collection(ptwDb, 'artifacts', PTW_APP_ID, 'public', 'data', 'permits'), (snapshot) => {
                    if (!snapshot.empty) {
                        const currentPermits = {};
                        snapshot.forEach(d => { currentPermits[d.id] = d.data(); });
                        setPermitsData(currentPermits);
                    }
                });
                const unsubSettings = onSnapshot(doc(ptwDb, 'artifacts', PTW_APP_ID, 'public', 'settings'), (docSnap) => {
                    if (docSnap.exists() && docSnap.data().employees) setPtwEmployees(docSnap.data().employees);
                });

                return () => { unsubConfig(); unsubUsers(); unsubPermits(); unsubSettings(); };
            }, [isFirebaseReady]);

            const executeLoginSuccess = (cleanEmail, grantedPermissions, isAdmin, password, rememberMe) => {
                setUserEmail(cleanEmail); setUserPermissions(grantedPermissions); setIsAdminUser(isAdmin);
                setIsLoggedIn(true); setIsAuthChecking(false); setIsPreloading(true);
                
                if (rememberMe) {
                    localStorage.setItem('dias_session', JSON.stringify({ email: cleanEmail, password: password, expiry: Date.now() + 7 * 24 * 60 * 60 * 1000 }));
                }

                let prog = 0;
                const intv = setInterval(() => {
                    prog += Math.floor(Math.random() * 25) + 15;
                    if (prog >= 100) {
                        prog = 100; setPreloadProgress(prog); clearInterval(intv);
                        setTimeout(() => { setIsPreloading(false); generateAiGreeting(cleanEmail.split('@')[0]); }, 500);
                    } else { setPreloadProgress(prog); }
                }, 300);
            };

            const handleLogin = (email, password, rememberMe = false, isAutoLogin = false) => {
                if (!isAutoLogin) setIsAuthChecking(true);
                
                setTimeout(() => {
                    const cleanEmail = email.toLowerCase().trim();
                    let hasAccess = false;
                    let grantedPermissions = null;
                    let isAdmin = false;

                    if (ALLOWED_ADMINS.includes(cleanEmail)) {
                        const storedUser = usersConfig?.registeredUsers?.[cleanEmail];
                        if (!storedUser) {
                            if (password === 'admin123') {
                                hasAccess = true; grantedPermissions = 'ALL'; isAdmin = true;
                                return executeLoginSuccess(cleanEmail, grantedPermissions, isAdmin, password, rememberMe);
                            }
                        }
                    }

                    if (usersConfig && usersConfig.registeredUsers && usersConfig.registeredUsers[cleanEmail]) {
                        const user = usersConfig.registeredUsers[cleanEmail];
                        if (user.password === password) {
                            if (password === 'user123' || password === 'reset123') {
                                setIsAuthChecking(false);
                                setPendingSetupEmail(cleanEmail);
                                setLoginMode('SETUP');
                                return;
                            }
                            hasAccess = true; grantedPermissions = user.access;
                            if (grantedPermissions === 'ALL') isAdmin = true;
                        }
                    }

                    if (hasAccess) {
                        executeLoginSuccess(cleanEmail, grantedPermissions, isAdmin, password, rememberMe);
                    } else {
                        setIsAuthChecking(false);
                        if(isAutoLogin) { localStorage.removeItem('dias_session'); return; }
                        showToast(language === 'en' ? 'Invalid email or password.' : 'Email atau kata sandi salah.');
                    }
                }, 1000);
            };

            const handleSignUp = async (userData) => {
                setIsAuthChecking(true);
                return new Promise((resolve) => {
                    setTimeout(async () => {
                        const currentConfig = { ...usersConfig };
                        const cleanEmail = userData.email.toLowerCase().trim();
                        
                        if (!currentConfig.pendingRequests) currentConfig.pendingRequests = [];

                        if (currentConfig.registeredUsers[cleanEmail] || currentConfig.pendingRequests.some(p => p.email === cleanEmail && p.type !== 'RESET')) {
                            showToast(language === 'en' ? "Email is already registered or pending." : "Email sudah terdaftar atau menunggu persetujuan.");
                            setIsAuthChecking(false);
                            resolve(false);
                        } else {
                            currentConfig.pendingRequests.push({ ...userData, email: cleanEmail, type: 'SIGNUP', requestedAt: new Date().toISOString() });
                            try {
                                await setDoc(doc(diasDb, 'artifacts', DIAS_APP_ID, 'public', 'data', 'config', 'users'), currentConfig);
                                showToast(language === 'en' ? "Registration sent! Awaiting Admin approval." : "Pendaftaran terkirim! Menunggu persetujuan Admin.");
                                resolve(true);
                            } catch (e) {
                                showToast("Error: " + e.message);
                                resolve(false);
                            }
                        }
                        setIsAuthChecking(false);
                    }, 800);
                });
            };

            const handleRequestReset = async (email) => {
                setIsAuthChecking(true);
                return new Promise((resolve) => {
                    setTimeout(async () => {
                        const currentConfig = { ...usersConfig };
                        const cleanEmail = email.toLowerCase().trim();
                        
                        if (!currentConfig.pendingRequests) currentConfig.pendingRequests = [];
                        
                        if (!currentConfig.registeredUsers[cleanEmail] && !ALLOWED_ADMINS.includes(cleanEmail)) {
                            showToast(language === 'en' ? "Email not found in our database." : "Email tidak ditemukan di database.");
                            setIsAuthChecking(false);
                            resolve(false);
                            return;
                        }

                        currentConfig.pendingRequests.push({ email: cleanEmail, type: 'RESET', requestedAt: new Date().toISOString() });
                        try {
                            await setDoc(doc(diasDb, 'artifacts', DIAS_APP_ID, 'public', 'data', 'config', 'users'), currentConfig);
                            showToast(language === 'en' ? "Password reset request sent to Admin." : "Permintaan reset sandi dikirim ke Admin.");
                            resolve(true); 
                        } catch (e) {
                            showToast("Error: " + e.message);
                            resolve(false);
                        }
                        setIsAuthChecking(false);
                    }, 800);
                });
            };

            const handleSetupPassword = async (newPassword) => {
                setIsAuthChecking(true);
                try {
                    const currentConfig = { ...usersConfig };
                    if (currentConfig.registeredUsers[pendingSetupEmail]) {
                        currentConfig.registeredUsers[pendingSetupEmail].password = newPassword;
                        await setDoc(doc(diasDb, 'artifacts', DIAS_APP_ID, 'public', 'data', 'config', 'users'), currentConfig);
                        showToast(language === 'en' ? "Password saved! Logging in..." : "Kata sandi disimpan! Memasukkan Anda...");
                        handleLogin(pendingSetupEmail, newPassword, false);
                    } else if (ALLOWED_ADMINS.includes(pendingSetupEmail)) {
                        currentConfig.registeredUsers[pendingSetupEmail] = { name: 'Admin', password: newPassword, access: 'ALL' };
                        await setDoc(doc(diasDb, 'artifacts', DIAS_APP_ID, 'public', 'data', 'config', 'users'), currentConfig);
                        showToast(language === 'en' ? "Password saved! Logging in..." : "Kata sandi disimpan! Memasukkan Anda...");
                        handleLogin(pendingSetupEmail, newPassword, false);
                    }
                } catch (e) {
                    showToast("Error: " + e.message);
                    setIsAuthChecking(false);
                }
            };

            const handleLogout = () => { 
                setIsLoggedIn(false); 
                setUserEmail(''); 
                setActiveAppId('home'); 
                setIsAdminUser(false); 
                setLoginMode('LOGIN');
                localStorage.removeItem('dias_session');
            };

            // Menutup menu di HP jika modul dipilih
            const handleSelectApp = useCallback((appId, subItemId = null) => { 
                setActiveAppId(appId); 
                setActiveSubItemId(subItemId); 
                setSearchQuery(''); 
                if (window.innerWidth <= 768) setIsSidebarExpanded(false);
            }, []);

            const generateAiGreeting = (name) => {
                setIsAiLoading(true);
                setTimeout(() => {
                    const hour = new Date().getHours();
                    const timeOfDay = hour < 12 ? 'morning' : hour < 18 ? 'afternoon' : 'evening';
                    const timeId = hour < 12 ? 'pagi' : hour < 15 ? 'siang' : hour < 18 ? 'sore' : 'malam';
                    setAiGreeting(language === 'en' ? `Good ${timeOfDay}, ${name}! Here are your tasks.` : `Selamat ${timeId}, ${name}! Berikut tugas Anda.`);
                    setIsAiLoading(false);
                }, 1500);
            };

            const visibleApps = useMemo(() => {
                if (!userPermissions) return apps.filter(a => a.id === 'home');
                if (userPermissions === 'ALL') return apps;
                const permsArray = Array.isArray(userPermissions) ? userPermissions : [];
                return apps.filter(app => app.id === 'home' || app.id === 'admin_console' || permsArray.includes(app.id));
            }, [apps, userPermissions]);

            const userRoles = useMemo(() => {
                if (!userEmail || ptwEmployees.length === 0) return [];
                const targetEmail = userEmail.toLowerCase().trim();
                const me = ptwEmployees.find(e => (e.email && e.email.toLowerCase().trim() === targetEmail) || (e.secondaryEmail && e.secondaryEmail.toLowerCase().trim() === targetEmail));
                return me?.systemRoles || (me?.systemRole ? [me.systemRole] : []);
            }, [userEmail, ptwEmployees]);

            useEffect(() => {
                if (Object.keys(permitsData).length === 0 || !userEmail) return;

                const newNotifs = [];
                const matchIdentity = (val) => {
                    if (!val) return false;
                    const v = val.toString().toLowerCase().trim(); const e = userEmail.toLowerCase().trim();
                    if (v === e) return true;
                    const tokens = e.split('@')[0].split('.');
                    return tokens.some(t => t.length >= 3 && (v.includes(t) || t.includes(v)));
                };

                Object.keys(permitsData).forEach(key => {
                    const permit = permitsData[key];
                    if (!permit.permitNumber) return;
                    
                    const f1 = permit.file1 || {};
                    let isMyTask = false; let taskDescId = ''; let taskDescEn = ''; let target = null;

                    const isSpecificallyMyPermit = matchIdentity(permit.jobOwnerEmail) || matchIdentity(f1.jobOwnerEmail) || matchIdentity(permit.requester?.nama) || matchIdentity(f1.namaPemohon);
                    const isSpecificallyAssignedTech = matchIdentity(permit.authorityChecklist?.emailTeknisi) || matchIdentity(f1.emailTeknisi);
                    const hasEngineerRole = userRoles.includes('ENGINEER');
                    const hasAARole = userRoles.includes('AA') || userRoles.includes('AREA_AUTHORITY');

                    const getDashboardTarget = (roleKeyword) => {
                        const mainApp = apps.find(a => a.name && (a.name.toLowerCase() === 'permit dashboard' || a.name.toLowerCase().includes('dasbor permit')));
                        if (mainApp) return { appId: mainApp.id, subItemId: null };
                        const permitApp = apps.find(a => a.id === 'permit');
                        if (!permitApp || !permitApp.details) return { appId: 'permit', subItemId: null };
                        const dashboard = permitApp.details.find(d => {
                            const titleStr = (d.title?.id || d.title?.en || d.title || '').toLowerCase();
                            return (titleStr.includes('dasbor') || titleStr.includes('dashboard')) && (!roleKeyword || d.id.includes(roleKeyword));
                        });
                        return { appId: permitApp.id, subItemId: dashboard ? dashboard.id : (permitApp.details[1]?.id || null) };
                    };

                    switch(permit.stage) {
                        case 'REQUESTED': if (isSpecificallyMyPermit) { isMyTask = true; taskDescId = 'Menunggu Persetujuan Awal Anda'; taskDescEn = 'Awaiting Your Initial Approval'; target = getDashboardTarget('owner'); } break;
                        case 'JOB_OWNER_APPROVED': if (hasEngineerRole) { isMyTask = true; taskDescId = 'Menunggu Tinjauan Anda (Engineer)'; taskDescEn = 'Awaiting Your Review (Engineer)'; target = getDashboardTarget('engineer'); } break;
                        case 'ENGINEER_APPROVED': if (hasAARole) { isMyTask = true; taskDescId = 'Perlu Penugasan Teknisi (AA)'; taskDescEn = 'Needs Technician Assignment (AA)'; target = getDashboardTarget('tl'); } break;
                        case 'AA_ACKNOWLEDGED': if (isSpecificallyAssignedTech) { isMyTask = true; taskDescId = 'Lakukan Inspeksi Lapangan & Gas Test'; taskDescEn = 'Perform Field Inspection & Gas Test'; target = getDashboardTarget(); } break;
                        case 'TECHNICIAN_TESTING_DONE': if (hasAARole) { isMyTask = true; taskDescId = 'Menunggu Otorisasi ONLINE (AA)'; taskDescEn = 'Awaiting ONLINE Authorization (AA)'; target = getDashboardTarget('tl'); } break;
                        case 'ONLINE': if (isSpecificallyMyPermit) { isMyTask = true; taskDescId = 'Pekerjaan Aktif, Ajukan Closing Jika Selesai'; taskDescEn = 'Active Work, Request Closing When Done'; target = getDashboardTarget('owner'); } break;
                        case 'CLOSING_REQUESTED': if (matchIdentity(permit.aaEmail) || matchIdentity(f1.aaEmail) || hasAARole) { isMyTask = true; taskDescId = 'Menunggu Finalisasi Penutupan Anda'; taskDescEn = 'Awaiting Your Closing Finalization'; target = getDashboardTarget('tl'); } break;
                    }

                    if (isMyTask && target) {
                        newNotifs.push({
                            id: `task-${key}`, appId: target.appId, subItemId: target.subItemId, isRead: readNotifIds.has(`task-${key}`),
                            timestamp: permit.updatedAt?.toMillis ? permit.updatedAt.toMillis() : new Date().getTime(),
                            message: { id: `Permit ${permit.permitNumber}: ${taskDescId}`, en: `Permit ${permit.permitNumber}: ${taskDescEn}` }
                        });
                    }
                });

                newNotifs.sort((a, b) => b.timestamp - a.timestamp);
                setRealNotifications(newNotifs);
            }, [permitsData, userEmail, userRoles, readNotifIds]);

            const handleNotificationClick = (notif) => { setReadNotifIds(prev => new Set(prev).add(notif.id)); handleSelectApp(notif.appId, notif.subItemId); };

            if (isAuthChecking && !isLoggedIn && loginMode === 'LOGIN') {
                return (
                    <div className="h-screen w-full flex items-center justify-center bg-[#003c71]">
                        <div className="animate-spin w-10 h-10 border-4 border-white/20 border-t-white rounded-full"></div>
                    </div>
                );
            }
            
            if (!isLoggedIn) {
                return (
                    <>
                        <LoginPage 
                            onLogin={handleLogin} onSignUp={handleSignUp} onRequestReset={handleRequestReset} onSetupPassword={handleSetupPassword}
                            isLoading={isAuthChecking} language={language} loginAppearance={loginAppearance} 
                            initialMode={loginMode} pendingEmail={pendingSetupEmail}
                        />
                        <div className="toast-container">{toasts.map(toast => (<div key={toast.id} className="toast">{toast.message}</div>))}</div>
                    </>
                );
            }
            
            if (isPreloading) return <SplashScreen progress={preloadProgress} />;

            return (
                <div className="min-h-screen bg-yt-bg flex flex-col w-full text-yt-black font-sans relative">
                    <TopBar 
                        toggleSidebar={() => setIsSidebarExpanded(!isSidebarExpanded)} searchQuery={searchQuery} setSearchQuery={setSearchQuery} onSearch={() => activeAppId !== 'home' && setActiveAppId('home')} showToast={showToast}
                        unreadCount={realNotifications.filter(n => !n.isRead).length} notifications={realNotifications} onNotificationClick={handleNotificationClick} language={language} setLanguage={setLanguage} onLogout={handleLogout} userName={userName}
                        pwaPrompt={deferredPrompt} onInstallPwa={handleInstallPwa}
                    />
                    
                    <div className="flex flex-1 pt-14 w-full h-full relative">
                        <Sidebar apps={visibleApps} activeAppId={activeAppId} onSelectApp={handleSelectApp} isExpanded={isSidebarExpanded} language={language} notifications={realNotifications} isAdmin={isAdminUser} showToast={showToast} setIsExpanded={setIsSidebarExpanded} />
                        <div className={`flex-1 flex flex-col transition-all duration-300 ${isSidebarExpanded ? 'md:ml-[240px]' : 'md:ml-[72px]'} w-full bg-slate-50 relative overflow-hidden`}>
                            <main className="flex-1 w-full h-full relative overflow-y-auto">
                                <div className="absolute inset-0">
                                    {activeAppId === 'home' && <SystemDashboard allApps={visibleApps} onSelectApp={handleSelectApp} userName={userName} language={language} aiGreeting={aiGreeting} isAiLoading={isAiLoading} searchQuery={searchQuery} userRoles={userRoles} />}
                                    {activeAppId !== 'home' && activeAppId !== 'admin_console' && <UnifiedDashboard displayApp={visibleApps.find(a => a.id === activeAppId)} language={language} activeSubItemId={activeSubItemId} onSelectSubItem={(subId) => handleSelectApp(activeAppId, subId)} onBack={() => handleSelectApp(activeAppId, null)} notifications={realNotifications} />}
                                    {activeAppId === 'admin_console' && isAdminUser && <AdminConsole onClose={() => handleSelectApp('home')} currentApps={apps} language={language} showToast={showToast} openDialog={openDialog} />}
                                </div>
                            </main>
                        </div>
                    </div>

                    <CustomDialog isOpen={dialogState.isOpen} message={dialogState.message} onConfirm={dialogState.onConfirm} onCancel={() => setDialogState({ isOpen: false, message: '', onConfirm: null })} />
                    <div className="toast-container">{toasts.map(toast => (<div key={toast.id} className="toast">{toast.message}</div>))}</div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
